name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Test suite (includes pinned cross-platform result ids)
        run: python -m pytest -p no:cacheprovider -q tests/
      - name: Smoke run
        run: python -m simulation.run_prevention_simulation --smoke --output-dir smoke-out
      - name: Record platform and result id
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, platform
          m = json.load(open("smoke-out/run_manifest.json"))
          print(f"| {platform.platform()} | Python {platform.python_version()} | input_id `{m['input_id'][:16]}` | result_id `{m['result_id'][:16]}` |")
          PY
