name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Test suite (includes pinned cross-platform result ids)
        run: python -m pytest -p no:cacheprovider -q tests/
      - name: Smoke run
        run: python -m simulation.run_prevention_simulation --smoke --output-dir smoke-out
      - name: Record platform and result id
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, platform
          m = json.load(open("smoke-out/run_manifest.json"))
          print(f"| {platform.platform()} | Python {platform.python_version()} | input_id `{m['input_id'][:16]}` | result_id `{m['result_id'][:16]}` |")
          PY

  browser-runtime:
    # the lab in Pyodide (CPython compiled to WebAssembly) must give the same ids as CPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m lab.tools.build_web_bundle dist
      - run: npm install --no-save pyodide@314.0.7
      - name: Same ids in CPython and in Pyodide
        run: |
          python -m lab.tools.pyodide_check dist > cpython.json
          node lab/tools/pyodide_check.mjs dist > pyodide.json
          python -c "import json; a=json.load(open('cpython.json')); b=json.load(open('pyodide.json')); print(a); print(b); assert a==b"
