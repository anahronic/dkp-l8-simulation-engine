# DKP-1-PREVENTION-001 v1.0 — Childcare Sandbox Configuration
# Domain:  Childcare facility perimeter protection
# Version: v0.1 (initial calibration)

simulation:
  seed: 42
  num_zones: 3
  num_days: 30
  ticks_per_day: 24
  # F-04: Probability of SE ≥ TA escalation per intervention
  se_ge_ta_probability: 0.0
  # F-05: Probability of temporal alignment violation per intervention
  temporal_invalid_probability: 0.0
  # F-06: Minimum SE delay (ticks)
  se_delay_min: 1.0

protocol:
  # § 3.3 — Oracle consistency threshold
  epsilon_consistency: 0.15

  # § 3.6 — Intervention temporal window (seconds per tick)
  delta_t_int: 30.0

  # § 9.1 — Self-induced risk linkage threshold
  theta_self_induced: 0.5

  # § 9.3 — Pattern recurrence decay rate
  recurrence_decay: 0.9

  # § 9.3 — Recurrence threshold (decay starts after this many occurrences)
  recurrence_threshold: 3

  # § 9.4 — Coverage floor
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false

  # § 3.7 — Threat severity weights
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5

  # Threat activation profiles
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.25
      intensity_range: [0.3, 0.8]
    intrusion:
      activation_rate: 0.10
      intensity_range: [0.5, 1.0]
    unattended_child_exit:
      activation_rate: 0.20
      intensity_range: [0.4, 0.9]
    hazardous_trajectory:
      activation_rate: 0.30
      intensity_range: [0.2, 0.7]
    dangerous_object:
      activation_rate: 0.15
      intensity_range: [0.3, 0.8]
    congestion_escalation:
      activation_rate: 0.35
      intensity_range: [0.2, 0.6]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/childcare_v0_1
  write_csv: true
  write_json: true
  write_summary: true
