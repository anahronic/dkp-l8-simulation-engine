# DKP-1-PREVENTION-001 — synthetic childcare scenario, schema version 3.
#
# Every key is required; unknown keys are rejected.  Values marked [H-...]
# are hypotheses listed in simulation/modules/prevention/hypotheses.py and
# copied into each run_manifest.json.  None of them is a normative reading
# of the protocol.

schema_version: 3

scenario:
  id: childcare_v0_2
  description: >-
    Synthetic childcare facility perimeter; 6 risk channels, 4 oracle classes,
    patrol / weak / passive / optimizer subjects (adversarial disabled).
  synthetic: true

simulation:
  seed: 42
  num_zones: 3
  num_days: 30
  ticks_per_day: 24

time:                          # [H-TIME-1]
  tick_seconds: 3600           # 24 ticks x 3600 s = one civil day (DKP-0-TIME-001 §4.1)
  start_dti_day: 2461042       # DTI-Day of simulated day 0 (= 2026-01-01, TIME §9 vector)

protocol:
  epsilon_consistency: 0.15    # §3.3
  delta_t_int_seconds: 30      # §3.6 Δt_int, in seconds (v1 declared seconds but used ticks)
  theta_self_induced: 0.5      # §9.1
  coverage_floor: 0.1          # §9.4
  ta_time_basis: measurement   # [H-TIME-2]
  ttl_reference: signal        # [H-TTL-2] TTL at each signal's own time; 'decision' = re-apply at decision
  se_aggregation: max          # [H-SE-2] conservative
  confidence_rule: class_coverage      # [H-C]
  attribution_rule: ambiguity_zero     # [H-A-2] reading of §12 "attribution ambiguity -> SPD = 0"
  recurrence:                  # [H-T-1] v1 rule kept: per subject and channel, whole run
    key: [actor, channel]
    threshold: 3
    decay: 0.9
    window_seconds: null
    history: as_of_decision      # [H-T-3] count only occurrences known at decision time

domain:
  name: childcare
  include_adversarial: false
  actor_order: [patrol_worker, weak_worker, passive_bystander, adversarial_actor, optimizer_actor]   # used only by attribution_rule list_order
  channels:                    # weight: §3.7 non-negative scalar (no upper bound)
    unauthorized_adult_proximity: {weight: 0.9, activation_rate: 0.25, intensity_range: [0.3, 0.8]}
    intrusion:                    {weight: 1.0, activation_rate: 0.10, intensity_range: [0.5, 1.0]}
    unattended_child_exit:        {weight: 0.95, activation_rate: 0.20, intensity_range: [0.4, 0.9]}
    hazardous_trajectory:         {weight: 0.7, activation_rate: 0.30, intensity_range: [0.2, 0.7]}
    dangerous_object:             {weight: 0.8, activation_rate: 0.15, intensity_range: [0.3, 0.8]}
    congestion_escalation:        {weight: 0.5, activation_rate: 0.35, intensity_range: [0.2, 0.6]}
  actors:                      # [H-TIME-3] delays, [H-SUP] effectiveness, [H-A-1] claims
    patrol_worker:
      strategy: patrol
      effectiveness: 0.75
      effectiveness_range: [0.5, 0.9]
      response_rate: 0.95
      response_delay_seconds: [3, 40]
      attribution_claim: 1.0
      self_induce_rate: 0.0
    weak_worker:
      strategy: weak
      effectiveness: 0.4
      effectiveness_range: [0.2, 0.6]
      response_rate: 0.6
      response_delay_seconds: [10, 120]
      attribution_claim: 1.0
      self_induce_rate: 0.0
    passive_bystander:
      strategy: passive
      effectiveness: 0.0
      effectiveness_range: null
      response_rate: 0.0
      response_delay_seconds: [0, 0]
      attribution_claim: 0.0
      self_induce_rate: 0.0
    adversarial_actor:
      strategy: adversarial
      effectiveness: 0.5
      effectiveness_range: null
      response_rate: 0.7
      response_delay_seconds: [5, 30]
      attribution_claim: 1.0
      self_induce_rate: 0.05
    optimizer_actor:
      strategy: optimizer
      effectiveness: 0.85
      effectiveness_range: [0.8, 1.0]
      response_rate: 0.9
      response_delay_seconds: [2, 20]
      attribution_claim: 1.0
      self_induce_rate: 0.0

oracles:
  classes: [optical, thermal, lidar, access]
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]
  measurement_delay_seconds: [0.2, 2.0]   # [H-TIME-3]
  arrival_delay_seconds: [0.1, 3.0]       # [H-TIME-3]
  ttl_seconds:                            # [H-TTL] scenario hypotheses (ORACLE §9)
    optical: 10
    thermal: 10
    lidar: 5
    access: 30
  linkage_detection:                      # [H-L]
    detection_probability: 0.8
    detected_score_range: [0.6, 1.0]
    undetected_score_range: [0.0, 0.3]

attack:
  oracle_bias: null

output:
  directory: simulation/outputs/childcare_v0_2
