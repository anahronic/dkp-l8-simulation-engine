# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 2: TA Inflation
#
# Scenario: Actor inflates TA intensity (high-intensity threats) before
# partially suppressing, hoping to harvest larger SPD.
#
# Exploit vector: SPD ∝ W_k × S_k × … where S_k = (TA-SE)/TA
#   → if SE scales with TA, S_k stays constant; inflation does NOT help
# INVARIANT: all S_k values in output must be in [0, 1]

simulation:
  seed: 1002
  num_zones: 1
  num_days: 10
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.8, 1.0]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/ta_inflation
