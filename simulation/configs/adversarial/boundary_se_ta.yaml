# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 10: SE ≥ TA Boundary
#
# Scenario: SE intensity swept from 0.95 TA to 1.05 TA across the threshold.
#
# Protocol (§3.6): if SE_intensity ≥ TA_intensity → S_k = 0, SPD = 0.
#
# With se_ge_ta_probability=1.0, 100% of interventions generate SE ≥ TA.
# All positive SPD events are suppressed → total_spd = 0.
#
# INVARIANT: SPD = 0 for all events in this config (structural discontinuity at SE=TA).
# Transition from SE<TA to SE≥TA is an abrupt cliff — flagged as discontinuity risk.

simulation:
  seed: 1010
  num_zones: 1
  num_days: 5
  ticks_per_day: 4
  se_ge_ta_probability: 1.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]
    intrusion:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]
    unattended_child_exit:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]
    hazardous_trajectory:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]
    dangerous_object:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]
    congestion_escalation:
      activation_rate: 0.7
      intensity_range: [0.4, 0.6]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/boundary_se_ta
