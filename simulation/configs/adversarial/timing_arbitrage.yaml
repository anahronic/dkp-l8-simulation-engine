# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 4: Timing Arbitrage
#
# Scenario: Actor tries to optimise SE timing around the Δt_int=30s boundary.
#
# Exploit vector: place SE at t+29.9s (inside window) vs t+30.1s (outside).
# INVARIANT inside window: SPD is flat w.r.t. timing (S_k is intensity-based).
# DISCONTINUITY at Δt_int: temporal_valid flips True→False — must be flagged.
#
# Two variants tested:
#   se_delay_min=1.0  — normal range (well inside window)
#   se_delay_min=29.0 — near boundary (still technically valid)

simulation:
  seed: 1004
  num_zones: 1
  num_days: 10
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 29.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/timing_arbitrage
