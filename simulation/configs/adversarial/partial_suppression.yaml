# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 3: Partial Suppression Loop
#
# Scenario: Multiple actors each partially suppress the same threat,
# each computing SE independently against the original TA intensity.
#
# Structural finding: each actor computes SE = TA - suppression individually.
# Combined implied suppression can exceed TA, yet each actor earns positive SPD.
#
# INVARIANT: detect events where Σ(TA-SE_k) > TA AND SPD_k > 0
# This is a structural property of the system — logged as a risk.

simulation:
  seed: 1003
  num_zones: 1
  num_days: 10
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]
    intrusion:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]
    unattended_child_exit:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]
    hazardous_trajectory:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]
    dangerous_object:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]
    congestion_escalation:
      activation_rate: 0.7
      intensity_range: [0.4, 0.8]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/partial_suppression
