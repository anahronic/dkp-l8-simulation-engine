# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 6: Early Prevention
#
# Scenario: Actor prevents a risk BEFORE the TA is formally registered
# (se_time < ta_time → temporal window check fails).
#
# Exploit vector: if early prevention earns reward, actor can game timing
# to claim credit for pre-registered interventions.
#
# Expected: temporal_valid = (0 < dt ≤ Δt_int) requires dt > 0.
# INVARIANT: Reward(pre-TA) = 0  AND  Reward(post-TA) > 0
# → flags incentive gap: delaying intervention until after TA maximises reward.

simulation:
  seed: 1006
  num_zones: 1
  num_days: 5
  ticks_per_day: 4
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/early_prevention
