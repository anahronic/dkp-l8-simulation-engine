# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 5: Attribution Splitting
#
# Scenario: Many actors split the same threat response (100 actors × 0.01
# each vs 1 actor × 1.0).
#
# Expected: per-event budget enforcement (F-01) ensures Σ A_k ≤ 1.0.
# INVARIANT: sum of A_k values per event must never exceed 1.0.
# NOTE: in the childcare domain, all actors default to attribution_share=1.0,
# so only the first actor per event receives A_k > 0 (budget is exhausted).
# Tests verify this constraint using direct adapter calls.

simulation:
  seed: 1005
  num_zones: 1
  num_days: 10
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/attribution_split
