# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 7: Oracle Degradation
#
# Scenario: One oracle class is biased downward with high noise and dropout.
#
# Exploit vector: degraded sensors → delta_oracle > epsilon → informational →
# SPD = 0 even for genuine prevention.
#
# Expected: TA collapses gracefully (more informational events, never negative SPD).
# INVARIANT: TA_intensity ≥ 0 always; SPD values ≥ 0 always.

simulation:
  seed: 1007
  num_zones: 1
  num_days: 10
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.3, 0.8]

oracles:
  noise_sigma: 0.25
  dropout_rate: 0.20
  bias_range: [-0.15, 0.15]

output:
  directory: simulation/outputs/adversarial/oracle_degradation
