# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 1: Risk Farming
#
# Scenario: Actor creates controlled high-frequency threats and partially
# suppresses each one, attempting to accumulate SPD indefinitely.
#
# Exploit vector: repeated cycles → unbounded reward accumulation
# Expected protection: §9.3 recurrence decay → T_k → 0 over cycles
# INVARIANT: mean SPD per event in last quarter < first quarter

simulation:
  seed: 1001
  num_zones: 1
  num_days: 30
  ticks_per_day: 8
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]
    intrusion:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]
    unattended_child_exit:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]
    hazardous_trajectory:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]
    dangerous_object:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]
    congestion_escalation:
      activation_rate: 0.95
      intensity_range: [0.5, 0.8]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/risk_farming
