# DKP-1-PREVENTION-001 v1.0 — Adversarial Scenario 9: Linkage Threshold Sensitivity
#
# Scenario: Sweep linkage_score ∈ [0.45, 0.55] through the theta=0.5 boundary.
#
# Protocol (§9.1): T_k = 0 when linkage_score > theta  (strict inequality).
# This creates a step function: linkage=0.500 → T_k > 0; linkage=0.501 → T_k = 0.
#
# INVARIANT: the cliff at theta IS the protocol intention — document discontinuity.
# The test sweeps the boundary using the protocol adapter directly,
# not the full simulation runner.

simulation:
  seed: 1009
  num_zones: 1
  num_days: 5
  ticks_per_day: 4
  se_ge_ta_probability: 0.0
  temporal_invalid_probability: 0.0
  se_delay_min: 1.0

protocol:
  epsilon_consistency: 0.15
  delta_t_int: 30.0
  theta_self_induced: 0.5
  recurrence_decay: 0.9
  recurrence_threshold: 3
  coverage_floor: 0.1

domain:
  name: childcare
  include_adversarial: false
  threat_weights:
    unauthorized_adult_proximity: 0.9
    intrusion: 1.0
    unattended_child_exit: 0.95
    hazardous_trajectory: 0.7
    dangerous_object: 0.8
    congestion_escalation: 0.5
  threat_profiles:
    unauthorized_adult_proximity:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    intrusion:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    unattended_child_exit:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    hazardous_trajectory:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    dangerous_object:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]
    congestion_escalation:
      activation_rate: 0.6
      intensity_range: [0.3, 0.7]

oracles:
  noise_sigma: 0.05
  dropout_rate: 0.0
  bias_range: [0.0, 0.0]

output:
  directory: simulation/outputs/adversarial/linkage_sweep
