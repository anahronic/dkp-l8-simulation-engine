# Include only in dikenocracy.com's HTTPS server block.
# Longer ^~ prefixes win over location /api/ and regex locations.
location ~* (PRIVATE_DO_NOT_PUBLISH|search_ru|ru-sources|corpus[^/]*\.jsonl|audit%20rt) {
    return 404;
}
location ^~ /api/lab/v1/ {
    proxy_pass http://127.0.0.1:8720;
    client_max_body_size 256k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req zone=dkp_lab burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/keeper/v1/ {
    proxy_pass http://127.0.0.1:8721;
    client_max_body_size 16k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 180s;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no always;
    limit_req zone=dkp_keeper burst=4 nodelay;
    limit_req_status 429;
    limit_conn dkp_conn 2;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /keeper/ {
    root /var/www/html;
    # ^~ skips regex locations; repeat the deny guard inside this public prefix.
    if ($uri ~* "(PRIVATE_DO_NOT_PUBLISH|search_ru|ru-sources|corpus[^/]*\.jsonl)") { return 404; }
    try_files $uri =404;
    autoindex off;
    add_header Cache-Control "no-cache" always;
}
