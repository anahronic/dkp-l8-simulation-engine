# /etc/nginx/snippets/dkp-lab.conf — include only in dikenocracy.com's HTTPS server block.
# Protocol Lab API. The Keeper of Knowledge was retired on 2026-11-17 (owner decision): its former public
# prefixes answer 410 Gone (JSON for the API, the site's error page for the widget files).
# Longer ^~ prefixes win over location /api/ and regex locations.
location ~* (PRIVATE_DO_NOT_PUBLISH|search_ru|ru-sources|corpus[^/]*\.jsonl|audit%20rt) {
    return 404;
}
location ^~ /api/lab/v1/ {
    include /etc/nginx/snippets/dkp-api-errors.conf;
    proxy_pass http://127.0.0.1:8720;
    client_max_body_size 256k;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    limit_req zone=dkp_lab burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/keeper/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/dkp-security-headers.conf;
    return 410 '{"error":{"code":"gone","message":"The Keeper of Knowledge has been retired."}}\n';
}
location ^~ /keeper/ {
    return 410;
}
