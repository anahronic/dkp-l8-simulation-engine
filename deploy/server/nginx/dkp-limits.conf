# http context (/etc/nginx/conf.d). Existing zones and services are untouched.
# The app separately limits POSTs to 10/minute; nginx limits all Lab requests.
limit_req_zone $binary_remote_addr zone=dkp_lab:1m rate=2r/s;    # job status polling every 1-2 s fits
limit_req_zone $binary_remote_addr zone=dkp_keeper:1m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=dkp_conn:1m;
