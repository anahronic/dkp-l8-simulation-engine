# /etc/nginx/conf.d/dkp-limits.conf (http context). Existing zones and services are untouched.
# The app separately limits POSTs to 10/minute; nginx limits all Lab requests.
# (The Keeper zones dkp_keeper/dkp_conn were removed with the Keeper on 2026-11-17.)
limit_req_zone $binary_remote_addr zone=dkp_lab:1m rate=2r/s;    # job status polling every 1-2 s fits
